name: Probe
on:
  push:
    branches: [claude/project-thread-am5p5c]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          for u in "https://dataverse.harvard.edu/api/info/version" "https://dataverse.harvard.edu/api/search?q=CHGIS&type=dataset&per_page=50" "https://maps.cga.harvard.edu/tgaz/placename?fmt=json&n=%E9%95%BF%E5%AE%89" "https://chgis.fas.harvard.edu/"; do
            echo "== $u"; curl -sS -m 40 -A "Atlas/1.0" "$u" | head -c 6000; echo; done
