name: Probe
on:
  push:
    branches: [claude/project-thread-am5p5c]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          curl -sS -m 40 "https://dataverse.harvard.edu/api/info/version"; echo
          curl -sS -m 60 "https://dataverse.harvard.edu/api/dataverses/chgis/contents" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(x.get('type'), x.get('protocol'), x.get('authority'), x.get('identifier'), x.get('title') or '', x.get('id')) for x in d.get('data',[])]" || true
          curl -sS -m 60 "https://dataverse.harvard.edu/api/search?q=CHGIS&type=dataset&per_page=60" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(x['global_id'], x['name']) for x in d['data']['items']]" || true
