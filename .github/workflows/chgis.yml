# Fetches CHGIS V6 time-series data from Harvard Dataverse (tools/chgis_fetch.py) and puts it on the `chgis` branch (private: the CHGIS EULA forbids redistributing the layers).
# Run by hand (Actions → CHGIS → Run workflow); tools/build_admin.py builds data/admin.json from it.
name: CHGIS
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/chgis_fetch.py /tmp/out
      - name: Commit results
        run: |
          cd /tmp/out
          git init -q -b chgis
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -q -m "CHGIS from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" chgis
