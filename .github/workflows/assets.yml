# Checks that every picture and tile pack the indexes name is on R2 with the CORS header the page needs
# (tools/check_assets.py; see docs/data-updates.md). Runs when an index changes, every Monday (to catch a changed
# Cloudflare setting), and by hand (Actions → Assets → Run workflow).
name: Assets
on:
  push:
    branches: [main]
    paths: [data/tiles.json, data/ai-illustrations.json, data/music.json, data/narration.json, tools/check_assets.py]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_assets.py
