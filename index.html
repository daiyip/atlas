<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas</title>
<link rel="icon" href="docs/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="docs/img/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="docs/img/app-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atlas">
<meta name="theme-color" content="#101416">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@500;700&display=swap">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css?v=115">
</head>
<body>
<div id="app">
  <div id="map" role="region" aria-label="3D terrain map of China"></div>
  <div id="map2" role="region" aria-label="Second map for comparison" hidden></div>
  <section class="cmp-card panel" id="cmp-card" hidden></section>

  <section class="era panel" aria-live="polite">
    <div class="seal double" id="era-glyph">春秋</div>
    <h1 class="era-name" id="era-name">Spring and Autumn</h1>
    <div class="era-zh" id="era-zh"></div>
    <div class="era-year"><span id="year">770</span><small id="year-suffix">BCE</small></div>
    <p class="era-summary" id="era-summary"></p>
    <p class="era-ruler" id="era-ruler" hidden></p>
    <p class="era-snap" id="era-snap" hidden></p>
    <p class="era-note" id="era-note" hidden></p>
    <div class="era-corner">
      <button type="button" class="chip region-btn" id="region-btn" aria-expanded="false" aria-haspopup="true" data-i18n-title="goRegion" title="Go to region"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2 8h12M8 2c2 2 2.6 4 2.6 6S10 12 8 14M8 2C6 4 5.4 6 5.4 8S6 12 8 14" fill="none" stroke="currentColor" stroke-width="1.2"/></svg><span id="region-name"></span></button>
      <button type="button" class="chip era-more" id="era-more" aria-expanded="false" data-i18n="layers">Layers</button>
      <button type="button" class="chip lang-btn" id="lang" aria-haspopup="true" aria-expanded="false" aria-label="Language / 语言" title="Language / 语言"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h7M5.5 2v1.5M3.5 3.5c.6 2.4 2.2 4.3 4.5 5.3M7.5 3.5c-.5 2.6-2.3 4.8-5 6M8.5 14l2.75-6.5L14 14M9.4 12h3.7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="lang-name"></span><svg class="caret" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 4l2.5 2.5L7.5 4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button type="button" class="chip search-open" id="search-open" aria-label="Search" title="Search"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <button type="button" class="chip search-open" id="share-open" data-i18n-title="share" aria-label="Share" title="Share"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 9.5l3-3M7 4.5l1.2-1.2a2.5 2.5 0 013.5 3.5L10.5 8M9 11.5l-1.2 1.2a2.5 2.5 0 01-3.5-3.5L5.5 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <button type="button" class="chip search-open era-min" id="era-min" aria-expanded="true" aria-label="Minimise" title="Minimise"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </div>
    <div class="region-pop" id="region-pop" role="menu" hidden></div>
    <div class="lang-pop" id="lang-pop" role="menu" aria-label="Language / 语言" hidden></div>
    <div class="share-box" id="share-box" hidden><span></span><input type="text" readonly aria-label="Link"></div>
    <div class="era-layers" role="group" aria-labelledby="layers-label">
      <span id="layers-label" class="sr-only" data-i18n="layers">Layers</span>
      <div class="auto-row"><button type="button" class="switch" id="t-auto" aria-pressed="true"><i aria-hidden="true"></i><span data-i18n="autoLayers">Auto layers</span></button><small data-i18n="autoHint"></small></div>
      <div class="lg"><span data-i18n="g_map">Map</span>
        <button class="chip" id="t-3d" aria-pressed="true" data-i18n="t3d">3D terrain</button>
        <button class="chip" id="t-sat" aria-pressed="true" data-i18n="sat">Satellite</button>
        <button class="chip" id="t-geo" aria-pressed="true" data-i18n="geo">Landscape</button>
      </div>
      <div class="lg"><span data-i18n="g_pol">Power</span>
        <button class="chip" id="t-neighbours" aria-pressed="true" data-i18n="neighbours">Neighbours</button>
        <button class="chip layer" id="l-rulers" aria-pressed="true" data-i18n="rulers">Rulers</button>
        <button class="chip layer" id="l-capitals" aria-pressed="false" data-i18n="capitals">Capitals</button>
        <button class="chip" id="t-places" aria-pressed="true" data-i18n="cities">Cities</button>
        <button class="chip layer" id="l-clans" aria-pressed="true" data-i18n="clans">Elites</button>
      </div>
      <div class="lg"><span data-i18n="g_war">War</span>
        <button class="chip layer" id="l-armies" aria-pressed="true" data-i18n="armies">Armies</button>
        <button class="chip layer" id="l-passes" aria-pressed="true" data-i18n="passes">Passes</button>
        <button class="chip layer" id="l-walls" aria-pressed="true" data-i18n="walls">Great Walls</button>
      </div>
      <div class="lg"><span data-i18n="g_move">Travel</span>
        <button class="chip layer" id="l-roads" aria-pressed="true" data-i18n="roads">Roads</button>
        <button class="chip layer" id="l-routes" aria-pressed="true" data-i18n="routes">Routes</button>
        <button class="chip layer" id="l-exchange" aria-pressed="true" data-i18n="exchange">Exchange</button>
        <button class="chip layer" id="l-spread" aria-pressed="true" data-i18n="spread">Spread</button>
      </div>
      <div class="lg"><span data-i18n="g_cul">Culture</span>
        <button class="chip layer" id="l-people" aria-pressed="true" data-i18n="people_l">People</button>
        <button class="chip layer" id="l-faith" aria-pressed="false" data-i18n="faith">Faith</button>
        <button class="chip layer" id="l-inventions" aria-pressed="false" data-i18n="inventions">Inventions</button>
      </div>
    </div>
    <div class="pop-chart" id="pop-chart" hidden></div>
  </section>

  <div class="search panel" id="search" role="dialog" aria-label="Search" hidden>
    <div class="search-bar"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="search-q" type="text" enterkeyhint="search" autocomplete="off" spellcheck="false"><button type="button" class="zbtn" id="search-close" aria-label="Close">×</button></div>
    <div class="search-results" id="search-results"></div>
  </div>
  <div class="auto-strip panel" id="auto-strip" aria-live="polite" hidden></div>
  <div class="world-strip" id="world-strip" aria-label="Elsewhere this year" hidden></div>
  <section class="tour panel" id="tour" aria-live="polite" hidden>
    <div class="tour-bar"><i></i></div>
    <div class="tour-head"><span class="tour-title"></span><span class="tour-count"></span><button type="button" class="zbtn tour-close" aria-label="Close">×</button></div>
    <p><b class="tour-year"></b><span class="tour-text"></span></p>
    <div class="tour-ctl">
      <button type="button" class="chip tour-prev" data-i18n="tourPrev">Back</button>
      <button type="button" class="chip tour-auto" data-i18n="tourPlay">Play</button>
      <button type="button" class="chip tour-story" data-i18n="tourStory">Read the story</button>
      <a class="chip tour-ref" target="_blank" rel="noopener" hidden></a>
      <button type="button" class="chip tour-next" data-i18n="tourNext">Next</button>
    </div>
  </section>
  <aside class="ledger panel" id="ledger">
    <div class="ledger-head">
      <div class="ledger-tabs" role="tablist">
        <button class="tab" id="tab-tours" role="tab" aria-selected="false" data-i18n="tours">Tours</button>
        <button class="tab" id="tab-events" role="tab" aria-selected="true" data-i18n="events">Events</button>
        <button class="tab" id="tab-rulers" role="tab" aria-selected="false" data-i18n="rulers">Rulers</button>
        <button class="tab" id="tab-people" role="tab" aria-selected="false" data-i18n="people_l">People</button>
      </div>
      <span id="ev-count"></span>
      <button class="chip ledger-toggle" id="ledger-toggle" aria-expanded="true">Hide</button>
      <button type="button" class="chip search-open ledger-min" id="ledger-min" aria-expanded="true" aria-label="Minimise" title="Minimise"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </div>
    <div class="sel-card" id="sel-card" aria-live="polite" hidden></div>
    <div class="ev-filter" id="ev-filter" hidden></div>
    <ol class="ev-list" id="ev-list"></ol>
    <div class="rulers" id="rulers" hidden></div>
    <div class="rulers" id="people" hidden></div>
    <div class="rulers tour-tab" id="tour-tab" hidden></div>
    <article class="story" id="story" hidden></article>
    <p class="note" data-i18n="note">Borders are rough snapshots from the open historical-basemaps dataset, with some hand-drawn approximations. Terrain, coastlines and rivers are modern.</p>
  </aside>

  <section class="rail panel" aria-label="Timeline">
    <div class="play-box">
    <button class="play" id="play" aria-label="Play timeline">
      <svg viewBox="0 0 16 16" id="play-icon"><path d="M4 2l10 6-10 6z"/></svg>
    </button>
    <button type="button" class="speed" id="speed" data-i18n-title="speed" title="Speed">1×</button>
    </div>
    <div class="track-view" id="track-view">
      <div class="track">
        <div class="bands" id="bands"></div>
        <div class="ticks" id="ticks"></div>
        <input type="range" id="slider" min="0" max="1000" step="any" value="0" aria-label="Year">
      </div>
    </div>
    <div class="scale"><span id="scale-start"></span><span class="scale-hint" id="scale-hint"></span><span id="scale-end"></span></div>
    <div class="zoom" role="group" id="zoom">
      <button class="zbtn" id="pan-prev" aria-label="Earlier">‹</button>
      <button class="zbtn" id="zoom-out" aria-label="Zoom out">−</button>
      <span class="zlevel" id="zoom-level"></span>
      <button class="zbtn" id="zoom-in" aria-label="Zoom in">+</button>
      <button class="zbtn" id="pan-next" aria-label="Later">›</button>
    </div>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="app.js?v=115"></script>
</body>
</html>
